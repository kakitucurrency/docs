name: Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Assert the site is only the redirect page
        run: |
          mkdocs build --strict
          test "$(find site -name index.html | wc -l)" -eq 1

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
